[package]
name = "ii"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
resolver = "3"
description = "Terminal graphical coprocessor: math, diagrams and charts over the Kitty graphics protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zx0r/ii"
readme = "README.md"
keywords = ["terminal", "kitty", "latex", "svg", "tui"]
categories = ["command-line-utilities", "graphics"]

[lib]
name = "ii"
path = "src/lib.rs"

[[bin]]
name = "ii"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
lz4_flex = { version = "0.14.2", default-features = false, features = [
  "frame",
] }
memchr = "2.8.3"
mermaid-svg = "0.7.0"
png = "0.18.1"
ratex-layout = "0.1.16"
ratex-parser = "0.1.16"
ratex-svg = "0.1.16"
resvg = { version = "0.50.0", default-features = false }
rustix = { version = "1.1.6", features = [
  "fs",
  "mm",
  "net",
  "event",
  "process",
  "termios",
  "shm",
] }
tiny-skia = "0.12.0"

[dev-dependencies]
divan = "0.1.21"
proptest = "1.12"

[profile.release]
opt-level = 3
codegen-units = 1
incremental = false
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.release-small]
inherits = "release"
opt-level = "z"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_unsafe_ops_per_block = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
inline_always = "warn"
needless_pass_by_value = "warn"
