[package]
name = "ii"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
resolver = "3"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zx0r/ii"
categories = ["command-line-utilities", "graphics"]
keywords = ["jupyter-notebook", "markdown", "latex", "svg", "mermaid"]
description = "Terminal graphical coprocessor: math, diagrams and charts over the Kitty graphics protocol"


[lib]
name = "ii"
path = "src/lib.rs"

[[bin]]
name = "ii"
path = "src/main.rs"

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "daemon"
harness = false

[[test]]
name = "core"
path = "tests/core.rs"

[[test]]
name = "daemon"
path = "tests/daemon.rs"

[[test]]
name = "fmt"
path = "tests/fmt.rs"

[[test]]
name = "io"
path = "tests/io.rs"

[[test]]
name = "render"
path = "tests/render.rs"

[dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = [
  "rust_backend",
] }
bzip2-rs = "0.1.2"
lzma-rust2 = { version = "0.25.0", default-features = false, features = [
  "std",
  "xz",
] }
ruzstd = "0.9.1"
blake3 = "1.8.7"
lz4_flex = { version = "0.14.2", default-features = false }
memchr = "2.8.3"
mermaid-svg = "0.7.0"
tiny-skia = "0.12.0"
png = { version = "0.18.1", default-features = false }
ratex-layout = "0.1.16"
ratex-parser = "0.1.16"
ratex-svg = { version = "0.1.16", features = ["embed-fonts"] }
ratex-types = "0.1.16"
resvg = { version = "0.50.0", default-features = false, features = [
  "text",
  "system-fonts",
  "memmap-fonts",
] }
rustix = { version = "1.1.6", features = [
  "fs",
  "mm",
  "net",
  "event",
  "process",
  "termios",
  "shm",
] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
divan = "0.1.21"
proptest = "1.12"

[profile.release]
lto = "fat"
panic = "abort"
strip = "symbols"
opt-level = 3
codegen-units = 1
incremental = false

[profile.bench]
inherits = "release"
debug = "line-tables-only"
lto = "fat"
codegen-units = 1

[profile.release-small]
opt-level = "z"
inherits = "release"

[lints.rust]
trivial_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
panic = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
unimplemented = "deny"
inline_always = "deny"
allow_attributes = "deny"
needless_pass_by_value = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes_without_reason = "deny"
