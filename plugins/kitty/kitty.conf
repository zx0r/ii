# ══════════════════════════════════════════════════════════════════════════════
# ii — Principal Kitty Graphics Protocol (KGP) & Zero-Fork IPC Configuration
# Include in ~/.config/kitty/kitty.conf:
#   include ii.conf
# Or generate via:
#   ii init kitty >> ~/.config/kitty/kitty.conf
# ══════════════════════════════════════════════════════════════════════════════

# 1. Zero-Latency Frame Pacing & SIMD Raster Sync
repaint_delay                2
input_delay                  0
sync_to_monitor              yes

# 2. Kitty Graphics Protocol (POSIX SHM Zero-Copy Transport & VRAM Quota)
# Allows 320 MiB per window in terminal VRAM for instant O(1) VramEntry hits
allow_remote_control         socket-only
listen_on                    unix:@ii-kitty
allow_hyperlinks             yes

# 3. Typography & Cell-Snapped Math / Diagram Alignment
font_family                  Maple Mono NF
bold_font                    auto
italic_font                  auto
bold_italic_font             auto
disable_ligatures            cursor
 modify_font cell_height     100%

# 4. Persistent Zero-Fork IPC Coprocessor Daemon Startup
# Spawns `ii --mode daemon` automatically when Kitty initializes (idempotent)
startup_session              none
watcher                      none
env II_SOCKET_AUTOSPAWN=1
