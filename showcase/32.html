<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model evaluation</title>
  </head>
  <body>
    <h1>Model evaluation</h1>
    <h2 id="accuracy">Validation accuracy</h2>
    <p>Held-out validation accuracy rises from 72% at epoch 1 to 94% at epoch 5.</p>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="480"
      height="170"
      viewBox="0 0 480 170"
      role="img"
      aria-label="Validation accuracy by epoch"
    >
      <path
        d="M55 26V132H452 M55 62H452 M55 98H452"
        fill="none"
        stroke="#657386"
        stroke-width="1"
      />
      <polyline
        points="75,124 164,92 253,68 342,52 431,36"
        fill="none"
        stroke="#00b9cc"
        stroke-width="3"
      />
      <g fill="#00b9cc">
        <circle cx="75" cy="124" r="4" />
        <circle cx="164" cy="92" r="4" />
        <circle cx="253" cy="68" r="4" />
        <circle cx="342" cy="52" r="4" />
        <circle cx="431" cy="36" r="4" />
      </g>
      <g fill="#687c96" font-family="monospace" font-size="11">
        <text x="8" y="40">95%</text>
        <text x="8" y="126">70%</text>
        <text x="70" y="151">1</text>
        <text x="427" y="151">5</text>
        <text x="228" y="151">Epoch</text>
      </g>
    </svg>

    <h2 id="latency">Inference latency</h2>
    <p>Median latency for model variants A, B and C is 18, 24 and 31 ms.</p>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="480"
      height="158"
      viewBox="0 0 480 158"
      role="img"
      aria-label="Median inference latency by model"
    >
      <g fill="#687c96" font-family="monospace" font-size="12">
        <text x="25" y="34">A</text>
        <text x="25" y="78">B</text>
        <text x="25" y="122">C</text>
        <text x="247" y="34">18 ms</text>
        <text x="307" y="78">24 ms</text>
        <text x="377" y="122">31 ms</text>
      </g>
      <rect x="58" y="18" width="180" height="24" rx="4" fill="#00b9cc" />
      <rect x="58" y="62" width="240" height="24" rx="4" fill="#aa63e8" />
      <rect x="58" y="106" width="310" height="24" rx="4" fill="#dc4a9b" />
    </svg>
  </body>
</html>
